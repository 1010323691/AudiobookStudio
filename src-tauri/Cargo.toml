[package]
name = "audiobookstudio"
version = "0.1.0"
description = "AudiobookStudio — 有声书一条龙制作工具（Tauri 桌面壳）"
authors = ["AudiobookStudio"]
edition = "2021"
rust-version = "1.77"

# Library target holds the `run()` entry point; the binary (main.rs) calls it.
[lib]
name = "audiobookstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
strip = true
